[build]
  publish = "."

# Auto-correct relative URLs like /index.html/admin/login
[[redirects]]
  from = "/index.html/admin/*"
  to = "/admin/:splat"
  status = 301
  force = true

# Backend API Proxy (Uncomment and set your Render/Railway backend URL if hosting on Netlify)
# Netlify is a static host and cannot run Node.js/Express/SQLite directly.
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-app.onrender.com/api/:splat"
#   status = 200
#   force = true

# Admin Panel SPA (React Router at /admin and /admin/*)
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Standalone SOC Console
[[redirects]]
  from = "/soc"
  to = "/admin.html"
  status = 200

# Portfolio Website SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
